name: mobilis_by_psdc_app
description: "Mobilis - A professional car rental app."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ">=3.10.7 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.12.0
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^17.2.4
  geolocator: ^11.0.0
  geocoding: ^2.1.1
  http: ^1.6.0
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  connectivity_plus: ^6.0.0
  shared_preferences: ^2.5.4
  crypto: ^3.0.7
  url_launcher: ^6.2.0
  video_player: ^2.9.2
  font_awesome_flutter: ^10.8.0
  table_calendar: ^3.0.9
  image_picker: ^1.0.7
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  image: ^4.8.0
  file_picker: ^8.1.7
  fl_chart: ^1.2.0
  pdf: ^3.10.6
  printing: ^5.11.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0

dependency_overrides:
  video_player_android: 2.7.15
  shared_preferences_android: 2.3.3


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/logo1.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/illustrations/
    - assets/loading.gif
