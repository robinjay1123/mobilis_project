name: Build iOS IPA & Publish Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag to publish to (e.g. v1.3.3 or APK)'
        required: false
        default: 'v1.3.3'
      create_release:
        description: 'Publish Mobilis.ipa to GitHub Releases'
        type: boolean
        required: true
        default: true
  push:
    tags:
      - 'v*'
      - 'ios-v*'

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Flutter & Disable Swift Package Manager
        run: |
          flutter config --no-enable-swift-package-manager
          rm -rf ios/Flutter/ephemeral/Packages build/ios/SourcePackages

      - name: Install dependencies
        run: flutter pub get

      - name: Patch camera_avfoundation for Xcode 16 / iOS 18
        run: |
          python3 -c "
          import os
          cache_dir = os.path.expanduser('~/.pub-cache')
          for root, dirs, files in os.walk(cache_dir):
              for file in files:
                  if file == 'DefaultCamera.swift':
                      path = os.path.join(root, file)
                      with open(path, 'r', encoding='utf-8') as f:
                          content = f.read()
                      new_content = content.replace(
                          'AVCaptureSession.wasInterruptedNotification',
                          'NSNotification.Name(\"AVCaptureSessionWasInterruptedNotification\")'
                      ).replace(
                          'AVCaptureSession.runtimeErrorNotification',
                          'NSNotification.Name(\"AVCaptureSessionRuntimeErrorNotification\")'
                      )
                      if content != new_content:
                          with open(path, 'w', encoding='utf-8') as f:
                              f.write(new_content)
                          print(f'Successfully patched {path}')
          "

      - name: Build iOS app (Release, unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package into IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r Mobilis.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mobilis-iOS-IPA
          path: build/ios/iphoneos/Mobilis.ipa
          retention-days: 30

      - name: Determine Release Tag
        id: release_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
            [ -z "$TAG" ] && TAG="v1.3.3"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Publish Mobilis.ipa to GitHub Releases
        if: ${{ github.event_name == 'push' || github.event.inputs.create_release != 'false' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: "Mobilis Release ${{ steps.release_info.outputs.tag }}"
          files: build/ios/iphoneos/Mobilis.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

