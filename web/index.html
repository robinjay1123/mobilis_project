<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Official Mobilis PSDC Car Rental Platform in Pangasinan. Hourly & Daily rates for Renters, Drivers, and Vehicle Partners. Headquartered in Urdaneta City.">

  <!-- Browser Chrome & Status Bar Styling (Never white) -->
  <meta name="theme-color" content="#030A18">
  <meta name="msapplication-TileColor" content="#030A18">
  <meta name="msapplication-navbutton-color" content="#030A18">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mobilis">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=2"/>
  <title>Mobilis | PSDC Car Rental - Pangasinan & Nearby</title>
  <link rel="manifest" href="manifest.json">

  <!-- Resource hints for faster startup -->
  <link rel="preconnect" href="https://zmaudwpinfdnlvplzovx.supabase.co" crossorigin>
  <link rel="dns-prefetch" href="https://zmaudwpinfdnlvplzovx.supabase.co">
  <link rel="preload" href="icons/Icon-192.png" as="image">

  <style>
    /* 1. Prevent default white canvas on initial page load */
    html, body {
      background-color: #030A18 !important;
      background: #030A18 !important;
      color: #FFFFFF;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* 2. Instant branded dark preloader (< 10ms render) */
    #loading-splash {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #030A18;
      background: radial-gradient(circle at 50% 42%, #0B1E40 0%, #030A18 75%);
      z-index: 999999;
      pointer-events: none;
      transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .splash-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px;
    }

    .splash-logo {
      width: 82px;
      height: 82px;
      object-fit: contain;
      margin-bottom: 20px;
      filter: drop-shadow(0 0 24px rgba(255, 215, 64, 0.45));
      animation: splash-pulse 2s ease-in-out infinite;
    }

    .splash-brand {
      color: #FFFFFF;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .splash-tagline {
      color: #FFD740;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 28px;
      opacity: 0.92;
    }

    .splash-bar-track {
      width: 150px;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .splash-bar-fill {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 45%;
      background: linear-gradient(90deg, transparent, #FFD740, transparent);
      border-radius: 999px;
      animation: splash-glide 1.3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes splash-pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.95;
      }
      50% {
        transform: scale(1.05);
        opacity: 1;
      }
    }

    @keyframes splash-glide {
      0% {
        transform: translateX(-100%);
      }
      100% {
        transform: translateX(300%);
      }
    }
  </style>
</head>
<body>
  <!-- Instant Dark Splash Screen (eliminates initial white screen) -->
  <div id="loading-splash">
    <div class="splash-box">
      <img class="splash-logo" src="icons/Icon-192.png" alt="Mobilis Logo" />
      <div class="splash-brand">MOBILIS</div>
      <div class="splash-tagline">CAR RENTAL • PANGASINAN</div>
      <div class="splash-bar-track">
        <div class="splash-bar-fill"></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      function dismissSplash() {
        var splash = document.getElementById('loading-splash');
        if (splash && splash.style.opacity !== '0') {
          splash.style.opacity = '0';
          setTimeout(function () {
            if (splash && splash.parentNode) {
              splash.parentNode.removeChild(splash);
            }
          }, 360);
        }
      }

      // Observer: as soon as Flutter renders flutter-view or flt-glass-pane, fade out splash
      var observer = new MutationObserver(function (mutations, obs) {
        var flutterTarget = document.querySelector('flutter-view, flt-glass-pane');
        if (flutterTarget) {
          setTimeout(dismissSplash, 60);
          obs.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });

      // Fallback safety timeout (5s)
      setTimeout(dismissSplash, 5000);

      window.dismissMobilisSplash = dismissSplash;
    })();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('firebase-messaging-sw.js');
      });
    }
  </script>
  <script src="flutter_bootstrap.js?v=20261025_playstore_v1" async></script>
</body>
</html>
